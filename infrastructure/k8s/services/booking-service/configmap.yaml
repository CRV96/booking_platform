apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
  namespace: booking-platform
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-postgresql:5432/bookingdb
  SPRING_DATASOURCE_USERNAME: postgres
  DB_POSTGRES_USERNAME: postgres
  SPRING_DATA_REDIS_HOST: redis-master
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  GRPC_CLIENT_EVENT_SERVICE_ADDRESS: static://event-service:9093
  GRPC_CLIENT_EVENT_SERVICE_NEGOTIATION_TYPE: PLAINTEXT
  SECURITY_JWT_ISSUER_URI: http://keycloak/realms/booking-platform
  SECURITY_JWT_JWK_SET_URI: http://keycloak/realms/booking-platform/protocol/openid-connect/certs
