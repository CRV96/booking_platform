apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: booking-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: booking-platform/ticket-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
            - name: grpc
              containerPort: 9096
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: ticket-service-config
            - secretRef:
                name: ticket-service-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
