image:
  tag: 3.9.0   # pin to a known working version — chart default (4.0.0) doesn't exist on Docker Hub

kraft:
  enabled: true   # KRaft mode — no Zookeeper

controller:
  replicaCount: 1   # single node for local dev (chart default is 3)

listeners:
  client:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT

extraConfig: |
  auto.create.topics.enable=true
  num.partitions=3
  default.replication.factor=1
  offsets.topic.replication.factor=1
  transaction.state.log.replication.factor=1
  transaction.state.log.min.isr=1
